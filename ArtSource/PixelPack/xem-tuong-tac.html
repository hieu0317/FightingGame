<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tương tác vật dụng · Loạn Đấu Phố Đêm</title>
<style>*{box-sizing:border-box}body{background:#14131f;color:#fff4d7;font:16px system-ui;margin:0}main{max-width:1000px;padding:24px;margin:auto}h1{font-size:clamp(28px,5vw,48px);margin:12px 0}canvas{display:block;width:100%;background:#272638;image-rendering:pixelated}label{display:inline-grid;gap:5px;margin:12px 8px 0 0}select,button{padding:8px;font:inherit;color:inherit;background:#343040;border:1px solid #746a85;border-radius:5px}a{color:#ffc471}p{line-height:1.5}</style>
<main><a style="color:#ffcb74" href="xem-tren-khong.html">Trên không và vật thể rời</a> · <a style="color:#ffc471" href="xem-dong-tac.html">Động tác cơ bản</a> · <a href="xem-animation.html">← Xem kỹ năng</a><h1>Tương tác vật dụng</h1><canvas id="screen" width="768" height="432"></canvas><label>Nhân vật<select id="fighter"></select></label><label>Vật dụng<select id="item"></select></label><label>Động tác<select id="action"></select></label><label>Bối cảnh<select id="stage"></select></label><button id="play">Tạm dừng</button> <button id="step">Từng khung</button><p id="info"></p></main>
<script>
const ids=['long','bao','linh','mai','khang','ba_tu'], names=['Long','Bảo','Linh','Mai','Khang','Bà Tư'];
const items=['ghe_nhua','chao_gang','ong_tuyp','choi_tre','chai_thuy_tinh','gach','noi_pho','thung_phi','binh_gas','thung_son','bua_ta','xe_may'];
const props=[{"Vật dụng": "Ghế nhựa đỏ", "Cỡ": "Vừa", "Loại": "Cùn", "Sát thương đánh": "45", "Sát thương ném": "60", "Độ bền (số lần trúng)": "4", "Thuộc tính": "–"}, {"Vật dụng": "Chảo gang", "Cỡ": "Vừa", "Loại": "Cùn", "Sát thương đánh": "60", "Sát thương ném": "70", "Độ bền (số lần trúng)": "6", "Thuộc tính": "Kim loại"}, {"Vật dụng": "Ống tuýp", "Cỡ": "Vừa", "Loại": "Dài", "Sát thương đánh": "50", "Sát thương ném": "55", "Độ bền (số lần trúng)": "8", "Thuộc tính": "Kim loại"}, {"Vật dụng": "Chổi tre", "Cỡ": "Vừa", "Loại": "Dài", "Sát thương đánh": "35", "Sát thương ném": "40", "Độ bền (số lần trúng)": "5", "Thuộc tính": "Dễ cháy"}, {"Vật dụng": "Chai thủy tinh", "Cỡ": "Nhỏ", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "70", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Dễ vỡ"}, {"Vật dụng": "Gạch", "Cỡ": "Nhỏ", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "80", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Dễ vỡ"}, {"Vật dụng": "Nồi phở", "Cỡ": "Lớn", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "90 + vũng nước", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Kim loại, chất lỏng"}, {"Vật dụng": "Thùng phi", "Cỡ": "Lớn", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "110", "Độ bền (số lần trúng)": "2", "Thuộc tính": "Kim loại"}, {"Vật dụng": "Bình gas", "Cỡ": "Lớn", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "60 + nổ 150", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Chất nổ, kim loại"}, {"Vật dụng": "Thùng sơn", "Cỡ": "Lớn", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "70 + vũng trơn", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Chất lỏng, dễ cháy"}, {"Vật dụng": "Búa tạ", "Cỡ": "Vừa", "Loại": "Nặng", "Sát thương đánh": "120", "Sát thương ném": "100", "Độ bền (số lần trúng)": "5", "Thuộc tính": "Kim loại"}, {"Vật dụng": "Xe máy cũ", "Cỡ": "Siêu lớn", "Loại": "–", "Sát thương đánh": "–", "Sát thương ném": "180", "Độ bền (số lần trúng)": "1", "Thuộc tính": "Kim loại, chất nổ"}];
const stages=['chodem','congtruong','bep','santhuong'],titles=['Chợ Đêm','Công Trường','Bếp Quán Lẩu','Sân Thượng'];
const labels={nhat:'Nhặt / nâng',cam:'Cầm',nem:'Ném',vung:'Vung',day:'Đẩy'};
const ticks={nhat:[4,3,4,3,5,3,4,5],cam:Array(8).fill(6),nem:[4,3,4,2,2,3,3,5],vung:[4,3,3,2,4,2,3,4],day:Array(8).fill(4)};
const $=id=>document.getElementById(id), ctx=$('screen').getContext('2d'), base='../../UnityProject/Assets/Art/PixelPack/';
const opts=(id,names,values)=>$(id).replaceChildren(...names.map((x,i)=>new Option(x,values[i])));
opts('fighter',names,ids);opts('item',props.map(p=>p['Vật dụng']),items);opts('stage',titles,stages);
let frame=0, playing=true, timer,strip=new Image(),bg=new Image();
function draw(){ctx.clearRect(0,0,768,432);ctx.imageSmoothingEnabled=false;if(bg.naturalWidth)ctx.drawImage(bg,0,0,768,432);if(strip.naturalWidth)ctx.drawImage(strip,224*frame,0,224,176,180,82,392,308)}
function advance(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{frame=(frame+1)%8;draw();advance()},($('fighter').value==='linh'&&$('action').value==='nem'?Math.round(ticks.nem[frame]/1.3):ticks[$('action').value][frame])*1000/60)}
function selectClip(){frame=0;strip=new Image();strip.onload=draw;strip.src=base+'Interactions/'+$('fighter').value+'/'+$('item').value+'/'+$('action').value+'.png';draw();advance()}
function actions(){const p=props[items.indexOf($('item').value)],heavy=p['Cỡ']==='Siêu lớn';const keys=heavy&&$('fighter').value!=='bao'?[]:['nhat','cam','nem'];if(p['Loại']!=='–')keys.push('vung');if(heavy)keys.push('day');opts('action',keys.map(a=>labels[a]),keys);$('info').textContent=p['Vật dụng']+' · Cỡ '+p['Cỡ']+' · '+p['Thuộc tính'];selectClip()}
function background(){bg=new Image();bg.onload=draw;bg.src=base+'Stages/'+$('stage').value+'.png'}
$('fighter').onchange=$('item').onchange=actions;$('stage').onchange=background;$('action').onchange=selectClip;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Tạm dừng':'Phát tiếp';advance()};$('step').onclick=()=>{playing=false;clearTimeout(timer);$('play').textContent='Phát tiếp';frame=(frame+1)%8;draw()};
background();actions();
</script></html>
